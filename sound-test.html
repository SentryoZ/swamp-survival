<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swamp Survival — Sound Test</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0f14;
        color: #e6edf3;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 28px 16px 60px;
      }
      h1 { font-size: 22px; letter-spacing: 3px; color: #ffd54f; margin: 0; }
      p.hint { color: #8b98a3; font-size: 13px; margin: -8px 0 0; text-align: center; }
      .panel {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #141b21;
        border: 1px solid #263238;
        border-radius: 10px;
        padding: 12px 18px;
      }
      .panel label { font-size: 13px; color: #aab6c0; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        width: min(720px, 100%);
      }
      button {
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        padding: 14px 10px;
        color: #fff;
        background: #1f2a31;
        border: 1px solid #31424c;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.1s ease, transform 0.06s ease;
      }
      button:hover { background: #2a3944; }
      button:active { transform: scale(0.97); }
      button.toggle.on { background: #1b5e20; border-color: #2e7d32; }
      button.toggle.off { background: #4e342e; border-color: #6d4c41; }
      input[type="range"] { width: 160px; }
      .muted { opacity: 0.5; }
      .status { font-size: 13px; color: #69f0ae; }
    </style>
  </head>
  <body>
    <h1>SOUND TEST</h1>
    <p class="hint">
      Click anything once to unlock audio (browsers block sound until a gesture).
      <br />These are the exact sounds from <code>src/audio.js</code>.
    </p>

    <div class="panel">
      <button id="mute" class="toggle on">SFX: ON</button>
      <label>Volume <input id="vol" type="range" min="0" max="100" value="35" /></label>
    </div>

    <div class="grid" id="grid"></div>

    <div class="status" id="status">ready</div>

    <script>
      // ---- synth (mirrors src/audio.js) ----
      let ctx = null;
      let master = null;
      let musicGain = null;
      let enabled = true;
      let musicTimer = null;
      const lastPlayed = new Map();

      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.35;
        master.connect(ctx.destination);
        musicGain = ctx.createGain();
        musicGain.gain.value = 0.5;
        musicGain.connect(master);
        return ctx;
      }

      function tone(type, freq, dur, vol, opts = {}) {
        if (!enabled) return;
        const c = ensure();
        if (!c) return;
        const t0 = c.currentTime + (opts.delay || 0);
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.to), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(opts.bus || master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.03);
      }

      function noise(dur, vol, cutoff) {
        if (!enabled) return;
        const c = ensure();
        if (!c) return;
        const t0 = c.currentTime;
        const frames = Math.max(1, Math.floor(c.sampleRate * dur));
        const buf = c.createBuffer(1, frames, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
        const src = c.createBufferSource();
        src.buffer = buf;
        const filt = c.createBiquadFilter();
        filt.type = "lowpass";
        filt.frequency.value = cutoff;
        const g = c.createGain();
        g.gain.value = vol;
        src.connect(filt).connect(g).connect(master);
        src.start(t0);
        src.stop(t0 + dur);
      }

      const SFX = {
        shoot: () => tone("square", 660, 0.06, 0.1, { to: 320 }),
        hit: () => tone("triangle", 320, 0.05, 0.14, { to: 200 }),
        kill: () => { tone("sawtooth", 220, 0.16, 0.2, { to: 80 }); noise(0.14, 0.1, 1300); },
        hurt: () => tone("sawtooth", 180, 0.2, 0.26, { to: 70 }),
        levelup: () => {
          tone("square", 523, 0.09, 0.2);
          tone("square", 659, 0.09, 0.2, { delay: 0.09 });
          tone("square", 784, 0.14, 0.2, { delay: 0.18 });
        },
        crate: () => { noise(0.16, 0.22, 900); tone("square", 300, 0.12, 0.14, { to: 120 }); },
        magnet: () => tone("sine", 520, 0.28, 0.2, { to: 1040 }),
        bomb: () => { noise(0.4, 0.34, 600); tone("sawtooth", 120, 0.35, 0.22, { to: 40 }); },
        freeze: () => {
          tone("sine", 1300, 0.32, 0.16, { to: 420 });
          tone("sine", 1700, 0.18, 0.08, { delay: 0.05 });
        },
        death: () => tone("sawtooth", 300, 0.6, 0.28, { to: 60 }),
        ui: () => tone("square", 520, 0.05, 0.14, { to: 620 }),
      };

      const THROTTLE = { shoot: 0.045, hit: 0.04, kill: 0.03, hurt: 0.25, crate: 0.05 };

      function playSfx(name) {
        if (!enabled) return;
        const fn = SFX[name];
        if (!fn) return;
        const min = THROTTLE[name] || 0;
        if (min) {
          const now = performance.now() / 1000;
          if (now - (lastPlayed.get(name) || 0) < min) return;
          lastPlayed.set(name, now);
        }
        fn();
      }

      function startMusic() {
        if (musicTimer) {
          clearInterval(musicTimer);
          musicTimer = null;
          return;
        }
        const c = ensure();
        if (!c) return;
        const bass = [110, 110, 146.83, 130.81];
        let step = 0;
        musicTimer = setInterval(() => {
          if (!enabled) return;
          tone("triangle", bass[step % bass.length], 0.35, 0.05, { bus: musicGain });
          if (step % 4 === 2) tone("sine", 440, 0.22, 0.028, { bus: musicGain });
          step++;
        }, 430);
      }

      // ---- UI ----
      const status = document.getElementById("status");
      status.textContent = "click a sound to unlock audio";
      window.addEventListener("pointerdown", () => {
        const c = ensure();
        if (c && c.state === "suspended") c.resume();
        status.textContent = "audio ready";
      });

      const grid = document.getElementById("grid");
      Object.keys(SFX).forEach((name) => {
        const b = document.createElement("button");
        b.textContent = name;
        b.addEventListener("click", () => playSfx(name));
        grid.appendChild(b);
      });

      const musicBtn = document.createElement("button");
      musicBtn.textContent = "MUSIC: OFF";
      musicBtn.className = "toggle off";
      musicBtn.style.gridColumn = "1 / -1";
      musicBtn.addEventListener("click", () => {
        startMusic();
        const on = !!musicTimer;
        musicBtn.textContent = `MUSIC: ${on ? "ON" : "OFF"}`;
        musicBtn.className = `toggle ${on ? "on" : "off"}`;
      });
      grid.appendChild(musicBtn);

      const muteBtn = document.getElementById("mute");
      muteBtn.addEventListener("click", () => {
        enabled = !enabled;
        muteBtn.textContent = `SFX: ${enabled ? "ON" : "OFF"}`;
        muteBtn.className = `toggle ${enabled ? "on" : "off"}`;
        document.body.classList.toggle("muted", !enabled);
      });

      document.getElementById("vol").addEventListener("input", (e) => {
        const c = ensure();
        if (master) master.gain.value = e.target.value / 100;
      });
    </script>
  </body>
</html>
